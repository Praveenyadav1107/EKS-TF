name: 'Terraform Manual Execution'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose to apply or destroy resources'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

env:
  AWS_REGION: 'ap-south-1'
  TF_VERSION: '1.5.0'

jobs:
  terraform:
    name: 'Terraform Execution'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # Runs plan ONLY if 'apply' is manually selected
      - name: Terraform Plan
        if: github.event.inputs.action == 'apply'
        id: plan
        run: terraform plan -out=tfplan

      # Runs apply ONLY if 'apply' is manually selected
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      # Runs destroy ONLY if 'destroy' is manually selected
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
