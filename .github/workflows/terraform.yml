name: 'Terraform Direct Apply'

on:
  workflow_dispatch: # This enables the manual "Run workflow" button in GitHub Actions
  push:
    branches:
      - main # Also runs automatically if you push directly to main

env:
  AWS_REGION: 'ap-south-1'
  TF_VERSION: '1.5.0'

jobs:
  terraform:
    name: 'Terraform Plan and Apply'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      # Formats code without failing the pipeline if spacing is slightly off
      #- name: Terraform Format
       # run: terraform fmt 

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan

      # This step no longer has an 'if' condition. It will ALWAYS run and apply the resources.
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
